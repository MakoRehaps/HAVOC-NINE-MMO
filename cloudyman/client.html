<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HAVOC-NINE / Cloudyman</title>
<style>body{background:#101822;color:#e7f0fc;font:16px system-ui;text-align:center;margin:0}main{max-width:850px;margin:24px auto;padding:12px}h1{color:#63e1ff}input,button{padding:12px;border:1px solid #6d829a;border-radius:8px;background:#26394e;color:white}button{cursor:pointer}canvas{width:100%;height:auto;background:#172535;border:2px solid #485b77;border-radius:12px;touch-action:none}#status{padding:12px}</style></head><body>
<main><h1>HAVOC-NINE / CLOUDYMAN</h1><p>Browser multiplayer test</p><input id="name" placeholder="Player name" maxlength="20"><button id="join">JOIN TEST</button><div id="status">Not connected</div><canvas id="world" width="800" height="500"></canvas><p>WASD, arrow keys, controller left stick, or touch to move.</p></main>
<script>
const cv=document.getElementById('world'),ctx=cv.getContext('2d'),status=document.getElementById('status');let ws=null,myId=null,players=[],drag=null;const keys=new Set();
window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))e.preventDefault();keys.add(e.key.toLowerCase())});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.offsetX,y:e.offsetY,bx:e.offsetX,by:e.offsetY}});cv.addEventListener('pointermove',e=>{if(drag){drag.x=e.offsetX;drag.y=e.offsetY}});['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>drag=null));
document.getElementById('join').onclick=()=>{if(ws)ws.close();ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws');status.textContent='Connecting…';ws.onopen=()=>ws.send(JSON.stringify({type:'name',name:document.getElementById('name').value||'Player'}));ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='welcome')myId=d.id;if(d.type==='state'){players=d.players;status.textContent='Connected — '+players.length+' player(s)'}};ws.onclose=()=>{status.textContent='Disconnected';myId=null;players=[]};ws.onerror=()=>status.textContent='Connection error'};
function loop(){let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let pad=navigator.getGamepads?.()[0];if(pad){if(Math.abs(pad.axes[0]||0)>0.15)dx+=pad.axes[0];if(Math.abs(pad.axes[1]||0)>0.15)dy+=pad.axes[1]}if(drag){dx+=(drag.x-drag.bx)/35;dy+=(drag.y-drag.by)/35}if(ws?.readyState===1&&(dx||dy))ws.send(JSON.stringify({type:'move',dx,dy}));ctx.clearRect(0,0,800,500);ctx.strokeStyle='#33475b';for(let x=0;x<=800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<=500;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}for(const p of players){ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.strokeStyle=p.id===myId?'#fff':'#526981';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText(p.name,p.x,p.y-20)}setTimeout(loop,40)}loop();
</script></body></html>
